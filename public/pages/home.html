<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/home.css">
    <title>VAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #13131a;
            --bg-sidebar: #0f0f15;
            --bg-main: #1a1a24;
            --bg-input: #0d0d12;
            --bg-nav: #13131a;
            --accent-blue: #5b9bd5;
            --accent-yellow: #c8b96e;
            --accent-red: #d95f6e;
            --text-primary: #e8e8f0;
            --text-muted: #7a7a9a;
            --text-sidebar: #c0c0d8;
            --border: #2a2a3a;
            --nav-border: #2e2e3e;
            --sidebar-width: 230px;
            --nav-height: 58px;
        }

        html, body {
            height: 100%;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            top: 0;
            left: var(--sidebar-width);
            right: 0;
            height: var(--nav-height);
            background: var(--bg-nav);
            border-bottom: 1px solid var(--nav-border);
            display: flex;
            align-items: stretch;
            z-index: 100;
        }

        nav a {
            display: flex;
            align-items: center;
            padding: 0 36px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            border-right: 1px solid var(--nav-border);
            transition: background 0.2s;
            white-space: nowrap;
        }

        nav a:first-child {
            border-left: none;
        }

        nav a:hover {
            background: rgba(255,255,255,0.04);
        }

        /* ── SIDEBAR ── */
        aside {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 200;
        }

        .sidebar-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header-btn {
            display: inline-block;
            background: #2a2a4a;
            color: var(--text-primary);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.1em;
            padding: 8px 20px;
            border-radius: 999px;
            border: 1px solid #3a3a5a;
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px 0 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .chat-history-list::-webkit-scrollbar { width: 4px; }
        .chat-history-list::-webkit-scrollbar-track { background: transparent; }
        .chat-history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .chat-item {
            padding: 9px 20px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-sidebar);
            cursor: pointer;
            text-align: center;
            line-height: 1.35;
            transition: background 0.15s, color 0.15s;
        }

        .chat-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .sidebar-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 18px;
        }

        .sidebar-footer {
            padding: 18px 20px 22px;
            text-align: center;
        }

        .sign-in-btn {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.12em;
            color: var(--text-primary);
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }

        .sign-in-btn:hover { color: var(--accent-blue); }

        /* ── MAIN ── */
        main {
            margin-left: var(--sidebar-width);
            margin-top: var(--nav-height);
            height: calc(100vh - var(--nav-height));
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 48px 40px 36px;
            position: relative;
        }

        /* subtle grid overlay */
        main::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 1;
        }

        .logo-letters {
            display: flex;
            gap: 2px;
            line-height: 1;
        }

        .logo-letter {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 7rem;
            line-height: 1;
        }

        .logo-letter.v { color: var(--accent-blue); }
        .logo-letter.a { color: var(--accent-yellow); }
        .logo-letter.l { color: var(--accent-red); }

        .logo-subtitle {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.22em;
            color: var(--text-primary);
            text-align: center;
        }

        /* ── INPUT ── */
        .input-area {
            width: 100%;
            max-width: 860px;
            z-index: 1;
        }

        .input-wrapper {
            width: 100%;
            background: var(--bg-input);
            border-radius: 18px;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-blue);
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-muted);
            caret-color: var(--accent-blue);
        }

        .input-wrapper input::placeholder { color: var(--text-muted); }
        .input-wrapper input:focus { color: var(--text-primary); }

        .send-btn {
            background: var(--accent-blue);
            border: none;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.15s;
        }

        .send-btn:hover {
            background: #7ab0e0;
            transform: scale(1.06);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* ── FOOTER ── */
        footer {
            display: none; /* hidden in this layout; kept in DOM for compatibility */
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div class="sidebar-header">
            <span class="sidebar-header-btn">Chat History</span>
        </div>

        <div class="chat-history-list">
            <div style="text-align:center; color: var(--text-muted); font-size: 0.82rem; font-weight: 600; padding: 24px 18px; letter-spacing: 0.05em;">No chats yet.</div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-footer">
            <button class="sign-in-btn">Sign In</button>
        </div>
    </aside>

    <!-- Top Nav -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Privacy</a>
        <a href="#">Terms &amp; Services</a>
        <a href="#">Copyright</a>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="title" style="display:none;">
            <h1>Chat With VAL</h1>
        </div>

        <div class="logo-area">
            <div class="logo-letters">
                <span class="logo-letter v">V</span>
                <span class="logo-letter a">A</span>
                <span class="logo-letter l">L</span>
            </div>
            <div class="logo-subtitle">Virtual Arithmetic Luminary</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" placeholder="Type your equation here" id="mathInput" />
                <button class="send-btn" aria-label="Send">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>More will be added soon.</p>
    </footer>

</body>
</html>
