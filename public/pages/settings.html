<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/info.css">
    <script src="../js/main.js"></script>
    <script src="../js/settings.js"></script>
    <title>Account Settings</title>
</head>
<body class="info-page">

    <!-- Logo -->
    <div class="logo-area">
        <div class="logo-letters">
            <span class="logo-letter v">V</span>
            <span class="logo-letter a">A</span>
            <span class="logo-letter l">L</span>
        </div>
        <div class="logo-subtitle">Virtual Arithmetic Luminary</div>
    </div>

    <!-- Nav -->
    <nav>
        <button onclick="changePage('home')">Home</button>
        <button onclick="changePage('about')">About</button>
        <button onclick="changePage('privacy')">Privacy</button>
        <button onclick="changePage('terms')">Terms &amp; Services</button>
        <button onclick="changePage('copyright')">Copyright</button>
    </nav>

    <!-- Main -->
    <main>
        <div class="page-label">Account Settings</div>

        <div class="content-card">
            <p>Test Image Upload</p>
            <img id="testPFP" style="max-height: 500px; width: auto" src="">
            <form id="uploadPFP" action="/api/storage/pfp/upload" method="POST" enctype="multipart/form-data">
                <label for="inputPFP">Upload Profile Picture</label>
                <input type="file" id="inputPFP" name="pfp" accept="image/*">
                <input type="submit" value="Upload">
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 VAL</p>
    </footer>
</body>
</html>
