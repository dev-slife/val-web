name: val

services:
    val-web:
        image: ${APP_IMAGE}
        container_name: val-web
        build:
            context: ..
            dockerfile: ./docker/val.Dockerfile
        ports:
            - "${HOST_PORT}:${APP_PORT}"
        networks:
            default:
                aliases:
                    - val.dev-slife.test
        environment:
            NODE_ENV: development
            MONGO_CONN: mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/?authSource=admin
            PORT: ${APP_PORT}
        restart: always
        depends_on:
            mongodb:
                condition: service_healthy

    mongo-express:
        image: mongo-express:latest
        container_name: mongo-express
        restart: always
        ports:
            - "8081:8081"
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
            ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASS}
            ME_CONFIG_MONGODB_URL: mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/?authSource=admin
            ME_CONFIG_BASICAUTH_USERNAME: ${DB_BASICAUTH_USER}
            ME_CONFIG_BASICAUTH_PASSWORD: ${DB_BASICAUTH_PASS}
        depends_on:
            mongodb:
                condition: service_healthy

    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}
        volumes:
            - mongo-data:/data/db
            - mongo-config:/data/configdb
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    mongo-data:
    mongo-config: