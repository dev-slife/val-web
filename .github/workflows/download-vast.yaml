name: AMA Download
env:
  AMA_BUILD: "ama-linux"
on:
  push:
    branches: [ main ]
    
permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Current Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout AMA Repo
      uses: actions/checkout@v4
      with:
        repository: dev-slife/val-ast
        token: ${{ secrets.AMA_DOWNLOAD }}
        path: val-ast

    - name: Grab Latest Tag
      id: latest-tag
      working-directory: val-ast
      run: |
        git fetch --tags --unshallow
        echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

    - name: Grab Latest Workflow Run
      id: latest-run
      env:
        GITHUB_TOKEN: ${{ secrets.AMA_DOWNLOAD }}
      run: |
        RUN_ID=$(gh api \
          -H "Accept: application/vnd.github+json" \
          /repos/dev-slife/val-ast/actions/runs?per_page=1 \
          | jq -r '.workflow_runs[0].id')

        if [ -z "$RUN_ID" ]; then
          echo "No workflow runs found - check if val-ast has Actions enabled"
          exit 1
        fi

        echo "run-id=$RUN_ID" >> $GITHUB_OUTPUT

    - name: Grab AMA Build
      id: latest-artifact
      env:
        GITHUB_TOKEN: ${{ secrets.AMA_DOWNLOAD }}
      run: |
        ARTIFACT_ID=$(gh api \
          -H "Accept: application/vnd.github+json" \
          /repos/dev-slife/val-ast/actions/runs/${{ steps.latest-run.outputs.run-id }}/artifacts \
          | jq -r --arg substr "$AMA_BUILD" '.artifacts[] | select(.name | contains($substr)) | .id // empty')

        if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
          echo "No artifact containing '$AMA_BUILD' found"
          exit 1
        fi

        echo "artifact-id=$ARTIFACT_ID" >> $GITHUB_OUTPUT

    - name: Set Tag Data
      run: |
        echo "AMA_VER=${{ steps.latest-tag.outputs.tag }}" >> $GITHUB_ENV
        echo "AMA_ID=${{ steps.latest-artifact.outputs.artifact-id }}" >> $GITHUB_ENV
    
    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Cache AMA
      id: cache
      uses: actions/cache@v4
      with:
        path: src/libs/ama
        key: ama-${{ env.AMA_ID }}
        restore-keys: ama-
    
    - name: Download AMA
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.AMA_DOWNLOAD }}
      run: |
        rm -rf src/libs/ama || true

        echo "Downloading artifact..."
        curl -L -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/dev-slife/val-ast/actions/artifacts/${{ env.AMA_ID }}/zip" \
          -o ama.zip

        mkdir -p src/libs/ama
        unzip -o ama.zip -d src/libs/ama/
        rm ama.zip
        ls -la src/libs/ama/

    - name: Test New AMA
      if: steps.cache.outputs.cache-hit != 'true'
      id: ama-test
      shell: bash
      run: |
        npm ci
        npm start &
        npx wait-on http://localhost:3000/ || sleep 5
        npm test
        npm audit fix

    - name: Commit AMA Files
      if: steps.cache.outputs.cache-hit != 'true' && steps.ama-test.outcome == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.AMA_UPLOAD }}
        GIT_AUTHOR_NAME: VAL
        GIT_AUTHOR_EMAIL: val-slife@users.noreply.github.com
        GIT_COMMITTER_NAME: VAL
        GIT_COMMITTER_EMAIL: val-slife@users.noreply.github.com
      run: |
        git config user.name "$GIT_AUTHOR_NAME"
        git config user.email "$GIT_AUTHOR_EMAIL"
        git add src/libs/ama/*
        git commit -m "Updated Dependency: AMA ${{ env.AMA_VER }}" || echo "No changes"
        git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/dev-slife/val-web.git
        git push origin HEAD:main

    - name: Revert AMA
      if: steps.cache.outputs.cache-hit != 'true' && steps.ama-test.outcome == 'failure'
      env:
        GITHUB_TOKEN: ${{ secrets.AMA_UPLOAD }}
        GIT_AUTHOR_NAME: VAL
        GIT_AUTHOR_EMAIL: val-slife@users.noreply.github.com
        GIT_COMMITTER_NAME: VAL
        GIT_COMMITTER_EMAIL: val-slife@users.noreply.github.com
      run: |
        git config user.name "$GIT_AUTHOR_NAME"
        git config user.email "$GIT_AUTHOR_EMAIL"
        git revert HEAD --no-edit
        git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/dev-slife/val-web.git
        git push origin HEAD:main