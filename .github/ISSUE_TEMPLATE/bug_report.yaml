name: Bug Report
description: Create a report to help us locate and fix bugs
title: "[Bug]"
labels: ["bug", "template"]
assignees: ["dev-slife"]

body:
  - type: textarea
    id: describe
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Please provide us the steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If possible, please add screenshots to help explain your problem.
    validations:
      required: false
  
  - type: textarea
    id: device
    attributes:
      label: Device Information
      description: Add your device information here to help us narrow down the problem.
      placeholder: |
        - Device: [e.g. Desktop]
        - OS: [e.g. Windows 11]
        - Browser [e.g. chrome, safari]
        - Version [e.g. v1.0.0]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
    validations:
      required: false